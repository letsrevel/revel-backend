name: Setup backend environment
description: >
  Shared CI setup: uv + dependencies, Django environment file, and geo
  fixture. Must run inside the pre-built CI container (ci.Dockerfile, built by
  ci-image.yaml), which already carries every system package — no apt here.
  Used by the jobs in test.yaml and refresh-test-durations.yaml — edit here,
  not in the jobs.

inputs:
  compile-translations:
    description: >
      Compile .po → .mo catalogs (ADR-0011: .mo files are not committed).
      Needed by jobs that run the test suite; i18n tests assert translated
      strings.
    default: "false"

runs:
  using: composite
  steps:
    - name: Install a specific version of uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.11.18"
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv sync

    - name: Recreate environment file
      shell: bash
      run: cp .env.example .env

    - name: Disable observability
      shell: bash
      run: echo "FEATURE_OBSERVABILITY=False" >> .env

    - name: Add worldcities.csv  # required so migrations can run
      shell: bash
      working-directory: src
      run: cp geo/fixtures/worldcities.mini.csv geo/data/worldcities.csv

    - name: Compile translations
      if: ${{ inputs.compile-translations == 'true' }}
      shell: bash
      working-directory: src
      run: uv run python manage.py compilemessages
