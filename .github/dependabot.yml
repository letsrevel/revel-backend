version: 2
updates:
  # Keep the pinned GitHub Actions SHAs current (Python deps are handled by the deps workflow).
  - package-ecosystem: github-actions
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns:
          - '*'
    labels:
      - dependencies
    commit-message:
      prefix: ci
