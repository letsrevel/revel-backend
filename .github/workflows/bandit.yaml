name: Bandit Security Scan

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - src/**/*.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/bandit.yaml
  pull_request:
    paths:
      - src/**/*.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/bandit.yaml

jobs:
  bandit:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.18"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run Bandit
        run: uv run bandit -c pyproject.toml -r src/ -ll -ii
