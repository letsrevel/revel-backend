name: Bandit Security Scan

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - src/**/*.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/bandit.yaml
  pull_request:
    paths:
      - src/**/*.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/bandit.yaml

jobs:
  bandit:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.18"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run Bandit
        run: uv run bandit -c pyproject.toml -r src/ -ll -ii
