# Publishes the multi-arch (linux/amd64 + linux/arm64) backend image to GHCR.
#
# Layout: Docker's "distribute build across multiple runners" pattern. Each
# architecture is built on a native runner (no QEMU emulation) and pushed to
# GHCR by digest only (untagged). The `merge` job then stitches the per-arch
# digests into one manifest list and tags it `latest` and `<version>`.
#
# arm64 failure is non-blocking: production servers are amd64, so a failed
# arm64 build must never hold back a release. `merge` runs even if the arm64
# build failed and publishes amd64 only (with a warning). A missing amd64
# digest is a hard failure.
#
# ponytail: arm64 is best-effort. If arm64 becomes a supported deployment
# target, make its failure blocking (require both digests in `merge`).
#
# Dry run: `workflow_dispatch` exercises the pipeline from any branch without
# a release. It skips tag/version validation, uses version `dryrun-<sha7>`,
# builds both arches (untagged by-digest pushes), and runs `imagetools create
# --dry-run`, so nothing is tagged. Inspect and Discord are skipped.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate tag format
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Error: Release tag '$TAG_NAME' must start with 'v' and follow semantic versioning (e.g., v1.0.0)"
            exit 1
          fi
          echo "✅ Tag format is valid: $TAG_NAME"

      - name: Validate version consistency
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"  # Strip 'v' prefix
          PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')

          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "❌ Error: Version mismatch!"
            echo "   Git tag version: $TAG_VERSION (from $TAG_NAME)"
            echo "   pyproject.toml version: $PYPROJECT_VERSION"
            echo "   Please ensure the release tag matches the version in pyproject.toml"
            exit 1
          fi
          echo "✅ Version consistency validated: $TAG_VERSION"

      - name: Extract version without v prefix
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="${TAG_NAME#v}"
          else
            VERSION="dryrun-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

  build:
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/local/lib/android \
                       /opt/hostedtoolcache \
                       /usr/share/dotnet \
                       /usr/share/swift \
                       /usr/share/miniconda \
                       /usr/local/share/boost
          docker system prune -af
          echo "After cleanup:"
          df -h

      - name: Compute platform pair
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/letsrevel/revel,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          mkdir -p "$DIGEST_DIR"
          touch "$DIGEST_DIR/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [validate, build]
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download amd64 digest
        id: dl_amd64
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: digests-linux-amd64
          path: ${{ runner.temp }}/digests/amd64

      - name: Download arm64 digest
        id: dl_arm64
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: digests-linux-arm64
          path: ${{ runner.temp }}/digests/arm64

      - name: Collect digests
        id: digests
        env:
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          AMD64=$(find "$DIGEST_DIR/amd64" -type f -printf '%f\n' 2>/dev/null | head -n1 || true)
          ARM64=$(find "$DIGEST_DIR/arm64" -type f -printf '%f\n' 2>/dev/null | head -n1 || true)

          if [ -z "$AMD64" ]; then
            echo "::error::amd64 digest is missing; refusing to publish. The amd64 build must succeed."
            exit 1
          fi
          echo "amd64=$AMD64" >> "$GITHUB_OUTPUT"

          if [ -z "$ARM64" ]; then
            echo "::warning::arm64 digest is missing; publishing amd64 only."
            echo "arm64_missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "arm64=$ARM64" >> "$GITHUB_OUTPUT"
            echo "arm64_missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          AMD64: ${{ steps.digests.outputs.amd64 }}
          ARM64: ${{ steps.digests.outputs.arm64 }}
        run: |
          IMAGE=ghcr.io/letsrevel/revel
          args=(-t "$IMAGE:latest" -t "$IMAGE:$VERSION")
          if [ "$EVENT_NAME" != "release" ]; then
            args+=(--dry-run)
          fi
          sources=("$IMAGE@sha256:$AMD64")
          if [ -n "$ARM64" ]; then
            sources+=("$IMAGE@sha256:$ARM64")
          fi
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Inspect image
        if: github.event_name == 'release'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: docker buildx imagetools inspect "ghcr.io/letsrevel/revel:$VERSION"

      - name: Summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          ARM64_MISSING: ${{ steps.digests.outputs.arm64_missing }}
        run: |
          {
            if [ "$EVENT_NAME" = "release" ]; then
              echo "### Published \`ghcr.io/letsrevel/revel:$VERSION\`"
            else
              echo "### Dry run for \`$VERSION\` (nothing tagged)"
            fi
            echo ""
            echo "- linux/amd64"
            if [ "$ARM64_MISSING" = "true" ]; then
              echo "- linux/arm64: **missing** (arm64 build failed)"
            else
              echo "- linux/arm64"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Discord
        if: github.event_name == 'release'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_BACKEND_WEBHOOK_URL }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          ARM64_MISSING: ${{ steps.digests.outputs.arm64_missing }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_BACKEND_WEBHOOK_URL not set, skipping notification"
            exit 0
          fi
          SUFFIX=""
          if [ "$ARM64_MISSING" = "true" ]; then
            SUFFIX=" (amd64 only — arm64 build failed)"
          fi
          # Build the JSON with jq so the interpolated values are escaped, not
          # spliced into the shell/JSON as GitHub Actions expressions.
          payload=$(jq -n --arg v "$VERSION" --arg url "$RELEASE_URL" --arg s "$SUFFIX" \
            '{content: "📦 `ghcr.io/letsrevel/revel:\($v)` is published and ready to deploy — \($url)\($s)"}')
          curl -sf --max-time 10 -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"
