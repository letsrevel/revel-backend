name: Test

on:
  workflow_dispatch: {}
  # No path filter: all jobs in this workflow are required status checks on
  # main, and a path-filtered workflow that doesn't fire leaves its required
  # contexts stuck on "Expected — Waiting for status", blocking the PR.
  # (The old filter also had dead globs — `./**/*.yaml` never matches because
  # GitHub matches paths without the leading `./` — and blind spots: template,
  # locale, and fixture changes skipped the suite entirely.)
  push:
    branches: [main]
  pull_request: {}

permissions:
  id-token: write
  contents: read
  packages: read  # pull the CI container image

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Pre-built container with all system deps (gdal, gettext, WeasyPrint libs...)
  # so no job runs apt-get. Rebuilt only when ci.Dockerfile changes.
  ci-image:
    name: CI image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yaml

  checks:
    name: Lint, type & schema checks
    runs-on: ubuntu-24.04
    needs: ci-image
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Normal runs are ~1–8 min. Without a cap a stalled step holds the
    # job (and the PR) for GitHub's 6 h default; fail fast and rerun instead.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup backend environment
        uses: ./.github/actions/setup-backend

      - name: Check uv.lock
        run: |
          # Steps in a container job get a different HOME than checkout's git
          # config, so the workspace looks like someone else's repo to git.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git diff --exit-code uv.lock > /dev/null; then
            echo "❌ uv.lock is out of sync with pyproject.toml. Run 'uv sync' and commit the updated lockfile."
            git diff uv.lock
            exit 1
          fi

      - name: Restore mypy cache
        uses: actions/cache@v5
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            mypy-${{ runner.os }}-

      - name: Run ruff formatting check
        run: uv run ruff format --check .

      - name: Run ruff linting check
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy --strict --extra-checks --warn-unreachable --warn-unused-ignores src

      - name: Check file length (max 1000 lines)
        run: ./scripts/check-file-length.sh 1000

      - name: Check Celery tasks declare explicit names
        run: uv run python scripts/check_task_names.py src

      - name: Check user-facing error messages are translated
        run: uv run python scripts/check_i18n_literals.py src

      - name: Check for missing migrations
        working-directory: src
        run: uv run manage.py makemigrations --check --dry-run --no-input

      - name: Check i18n catalog (keys extracted + translated)
        run: uv run python scripts/check_translations.py

  test:
    name: Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    needs: ci-image
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20  # normal: 5–8 min; see `checks`
    env:
      DB_HOST: postgres
      REDIS_HOST: redis
    services:
      # Mirrors docker-compose-base.yml (values match .env.example). GitHub
      # services can't take `command:`, so max_connections stays at the default
      # 100; pytest -n auto on 4 vCPUs holds ~1 connection per worker.
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: revel
          POSTGRES_PASSWORD: db-password
          POSTGRES_DB: revel
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U revel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - name: Setup backend environment
        uses: ./.github/actions/setup-backend
        with:
          compile-translations: "true"

      # pytest-split balances shards by runtime using the committed
      # `.test_durations` file; refreshed weekly by refresh-test-durations.yaml
      # (or manually via `make store-durations`; staleness degrades gracefully —
      # tests missing from the file are distributed by count). Coverage data is dropped
      # without a report — the `coverage` job combines all shards and enforces
      # the 90% gate. `strategy.job-total` is the GH-provided matrix size, so
      # `--splits` always matches the number of runners.
      - name: Run unit tests (shard ${{ matrix.shard }})
        env:
          COVERAGE_FILE: .coverage.shard-${{ matrix.shard }}
        run: |
          uv run pytest \
            -n auto \
            --splits ${{ strategy.job-total }} \
            --group ${{ matrix.shard }} \
            --cov=src \
            --cov-report= \
            --cov-branch \
            -m "not integration and not einvoice_conformance" \
            src

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .coverage.shard-${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  einvoice-conformance:
    name: EN 16931 conformance (Factur-X)
    runs-on: ubuntu-24.04
    needs: ci-image
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    env:
      DB_HOST: postgres
      REDIS_HOST: redis
    services:
      # Mirrors docker-compose-base.yml (values match .env.example). GitHub
      # services can't take `command:`, so max_connections stays at the default
      # 100; pytest -n auto on 4 vCPUs holds ~1 connection per worker.
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: revel
          POSTGRES_PASSWORD: db-password
          POSTGRES_DB: revel
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U revel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup backend environment
        uses: ./.github/actions/setup-backend

      # `euinvoice[validate]` (saxonche) lives in the dev group, which setup-backend's `uv sync` installs.
      - name: Read the pinned euinvoice version
        id: euinvoice
        run: |
          version=$(awk '/^name = "euinvoice"$/ { getline; sub(/^version = "/, ""); sub(/"$/, ""); print; exit }' uv.lock)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The official CEN/XRechnung/Peppol artifacts are pinned per euinvoice release, so the
      # version is the whole cache key.
      - name: Restore euinvoice validation artifacts
        uses: actions/cache@v5
        with:
          path: ~/.cache/euinvoice
          key: euinvoice-artifacts-${{ steps.euinvoice.outputs.version }}

      - name: Fetch euinvoice validation artifacts
        run: uv run python -m euinvoice artifacts fetch

      - name: Validate generated Factur-X documents against the CEN rules
        env:
          EINVOICE_CONFORMANCE_REQUIRED: "1"  # a missing artifact fails the job instead of skipping
        run: uv run pytest -m einvoice_conformance src/events/tests/test_einvoice/test_conformance.py

  coverage:
    name: Combined coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Install a specific version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.18"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Download all coverage shards
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          merge-multiple: true

      - name: Combine coverage
        run: uv run coverage combine .coverage.shard-*

      - name: Report coverage (fail under 90%)
        run: uv run coverage report --fail-under=90

      - name: Generate XML for Codecov
        if: github.ref == 'refs/heads/main'
        run: uv run coverage xml

      - name: Upload coverage reports to Codecov
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
