{# Organization brand colors for the pass/ticket PDFs (#1157). Include LAST in <head>, after the #}
{# template's own <style>. Renders nothing when `brand` is unset, so unbranded output is       #}
{# byte-identical to the Revel defaults. The "Powered by revel." lockup is never touched.      #}
{# `brand` is a PassBrandColors (events.utils.pass_branding): background/foreground for the    #}
{# solid surfaces, text_accent/text_secondary (AA on white/lavender paper) for small text.     #}
{% if brand %}
<style>
    .banner, .cover-banner { background: {{ brand.background }}; }
    {% if not cover_art_url %}
    .banner-overlay, .cover-overlay { background: none; color: {{ brand.foreground }}; }
    {% endif %}
    .main .eyebrow, .qr-zone .eyebrow, .stub .tid, .mid, .qr-instruction { color: {{ brand.text_accent }}; }
    .stub .eyebrow { color: {{ brand.text_secondary }}; }
    .tier-badge { background: {{ brand.background }}; color: {{ brand.foreground }}; }
    .info-card { border-left-color: {{ brand.background }}; }
    .events-card, .qr-code-container { border-color: {{ brand.background }}; }
    .accent-bar { background: {{ brand.background }}; }
</style>
{% endif %}
